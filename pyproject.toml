[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-fs"
version = "0.1.0"
description = "A minimal filesystem, written to be read"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
fuse = ["fusepy>=3"]

[project.scripts]
tiny-fs = "tiny_fs.cli:main"

[tool.setuptools]
packages = ["tiny_fs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fuse: needs FUSE (Linux only; run inside Docker with -m fuse)"]
addopts = "-m 'not fuse'"
