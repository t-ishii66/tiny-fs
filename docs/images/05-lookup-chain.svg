<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>パスから中身へたどる経路</title>
<rect x="0" y="0" width="900" height="190" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<text x="450.0" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">名前 → 中身 の経路は 1 本しかない</text>
<rect x="40" y="60" width="175" height="62" rx="4" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="127.5" y="87" font-size="13" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">/docs/a.txt</text>
<text x="127.5" y="106" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">パス（文字列）</text>
<rect x="255" y="60" width="175" height="62" rx="4" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="342.5" y="87" font-size="13" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">dirent</text>
<text x="342.5" y="106" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">name → ino</text>
<rect x="470" y="60" width="175" height="62" rx="4" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="557.5" y="87" font-size="13" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">i-node</text>
<text x="557.5" y="106" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino → direct[12]</text>
<rect x="685" y="60" width="175" height="62" rx="4" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="772.5" y="87" font-size="13" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">データブロック</text>
<text x="772.5" y="106" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">4096 バイトの中身</text>
<path d="M 215 91.0 L 255 91.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 430 91.0 L 470 91.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 645 91.0 L 685 91.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="235" y="148" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ディレクトリを線形検索</text>
<text x="450" y="148" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino → テーブル位置を計算</text>
<text x="665" y="148" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[off // 4096]</text>
<text x="450.0" y="176" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node は名前を持たない。名前はディレクトリ側の dirent にだけある。</text>
</svg>
