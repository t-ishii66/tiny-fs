<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>create の途中で失敗したら、取った i-node を返す</title>
<rect x="0" y="0" width="900" height="366" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">create の途中で失敗したら、取った i-node を返す</text>
<rect x="40" y="80" width="190" height="64" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="135" y="106" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">① i-node を 1 個取る</text>
<text x="135" y="128" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">inodes_alloc.allocate()</text>
<rect x="250" y="80" width="190" height="64" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="345" y="106" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">② テーブルに書く</text>
<text x="345" y="128" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">write_inode(5, inode)</text>
<rect x="460" y="80" width="190" height="64" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="555" y="106" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">③ 親に名前を足す</text>
<text x="555" y="128" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">add_entry(...)</text>
<rect x="670" y="80" width="190" height="64" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="765" y="106" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">④ 親の時刻を更新</text>
<text x="765" y="128" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">成功。ino 5 を返す</text>
<path d="M 234 112 L 246 112" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 444 112 L 456 112" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 654 112 L 666 112" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 555 148 L 555 182" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="575" y="172" font-size="10" fill="#b8860b" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">EEXIST / ENOSPC で失敗</text>
<rect x="420" y="186" width="270" height="100" rx="3" fill="#fff7ed" stroke="#b8690b" stroke-width="1.5"/>
<text x="555" y="212" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">write_inode(5, Inode.empty())</text>
<text x="555" y="236" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">inodes_alloc.mark_free(5)</text>
<text x="555" y="262" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">raise</text>
<path d="M 414 240 L 260 240" stroke="#b8860b" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
<text x="40" y="218" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">① と ② を</text>
<text x="40" y="238" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">そのまま取り消す</text>
<text x="40" y="264" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ビットも 128 バイトも</text>
<text x="40" y="282" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">create を呼ぶ前の姿に戻る</text>
<text x="450" y="326" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">返し忘れると、誰からも参照されていないのに使用中の i-node が 1 個残る。</text>
<text x="450" y="350" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">fsck（第 10 章）が孤立 i-node として検出する壊れ方がこれ。</text>
</svg>
