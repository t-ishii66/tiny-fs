<text x="216" y="241" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node ビットマップ</text>
<text x="470" y="241" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">クリーン</text>
<text x="600" y="241" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">最も古い</text>
<path d="M 44 242 L 44 100" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
