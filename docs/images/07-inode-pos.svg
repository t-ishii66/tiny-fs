<path d="M 157 330 L 157 282" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="157" y="348" font-size="10.5" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">offset 512 – 639</text>
<text x="860" y="348" font-size="10.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">block 3 の 4096 バイト = 128 バイト × 32 スロット。左端が offset 0</text>
<rect x="40" y="372" width="820" height="62" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="60" y="398" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">write_inode は block 3 を 4096 バイト読み、512 – 639 の 128 バイトだけ差し替えて、4096 バイト書き戻す</text>
<text x="60" y="418" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">同じブロックに他の 31 個の i-node が同居している。丸ごと上書きはできない</text>
<text x="450" y="456" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino = 37 なら index 36、block_no = 3 + 36 // 32 = 4、offset = (36 % 32) × 128 = 512。</text>
