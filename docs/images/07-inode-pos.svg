<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>ino = 5 の i-node はディスクのどこにあるか</title>
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">ino = 5 の i-node はディスクのどこにあるか</text>
<text xml:space="preserve" x="40" y="64" font-size="12.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">index    = ino - 1                         = 5 - 1   = 4</text>
<text xml:space="preserve" x="40" y="88" font-size="12.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block_no = inode_table_start + index // 32 = 3 + 0   = 3</text>
<text xml:space="preserve" x="40" y="112" font-size="12.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">offset   = (index % 32) * INODE_SIZE       = 4 * 128 = 512</text>
<text x="40" y="152" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">i-node テーブル（block 3 – 6、1 ブロックに 32 個）</text>
<rect x="40" y="164" width="200" height="56" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="2"/>
<text x="140" y="188" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 3</text>
<text x="140" y="208" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino 1 – 32</text>
<rect x="246" y="164" width="200" height="56" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="346" y="188" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 4</text>
<text x="346" y="208" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino 33 – 64</text>
<rect x="452" y="164" width="200" height="56" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="552" y="188" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 5</text>
<text x="552" y="208" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino 65 – 96</text>
<rect x="658" y="164" width="200" height="56" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="758" y="188" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 6</text>
