<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>ディスクに書かれる 3 つの契機</title>
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3f8f52"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4413c"/></marker></defs>
<text x="450.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">ディスクに書かれる 3 つの契機</text>
<rect x="300" y="80" width="300" height="130" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="450" y="104" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">キャッシュ</text>
<rect x="316" y="114" width="268" height="26" rx="3" fill="#fde8c8" stroke="#b8860b" stroke-width="1.5"/>
<text x="330" y="132" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block 3</text>
<text x="572" y="132" font-size="9" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ダーティ</text>
<rect x="316" y="144" width="268" height="26" rx="3" fill="#fde8c8" stroke="#b8860b" stroke-width="1.5"/>
<text x="330" y="162" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block 7</text>
<text x="572" y="162" font-size="9" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ダーティ</text>
<rect x="316" y="174" width="268" height="26" rx="3" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="330" y="192" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block 0</text>
<text x="572" y="192" font-size="9" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">クリーン</text>
<rect x="300" y="244" width="300" height="30" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="450" y="264" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">disk.img</text>
<rect x="40" y="110" width="200" height="46" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="54" y="130" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">fsync / sync</text>
<text x="54" y="145" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">アンマウント</text>
<path d="M 240 133 L 296 133" stroke="#b8860b" stroke-width="1.5" fill="none" marker-end="url(#y)"/>
<text x="280" y="125" font-size="9" fill="#b8860b" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">全ダーティを書く</text>
<rect x="40" y="170" width="200" height="46" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="54" y="190" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">周期的な書き出し</text>
<path d="M 240 193 L 296 193" stroke="#b8860b" stroke-width="1.5" fill="none" marker-end="url(#y)"/>
<text x="280" y="185" font-size="9" fill="#b8860b" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">古いダーティを書く</text>
<rect x="640" y="140" width="200" height="46" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="654" y="160" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">追い出し</text>
<path d="M 640 163 L 604 163" stroke="#b4413c" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
<text x="650" y="202" font-size="9" fill="#b4413c" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">犠牲 1 個だけ、</text>
<text x="650" y="216" font-size="9" fill="#b4413c" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ダーティなら書く</text>
<path d="M 360 214 L 360 240" stroke="#b8860b" stroke-width="1.5" fill="none" marker-end="url(#y)"/>
<path d="M 540 214 L 540 240" stroke="#b4413c" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
<text x="450" y="292" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">上の 2 つは自発的。ダーティを減らしておくほど、追い出しのときに書き出しを待たずに解放できる。</text>
</svg>
