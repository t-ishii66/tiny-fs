<text x="100" y="62" font-size="11" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node ビットマップ</text>
<text x="100" y="153.0" font-size="11" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node テーブル</text>
<text x="792" y="157.0" font-size="18" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">⋯</text>
<text x="792" y="62" font-size="16" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">⋯</text>
<text x="495.0" y="232" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">1 ブロック (4096 B) に 32 個ぴったり並ぶ（4096 ÷ 128）</text>
<text x="450.0" y="276" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node 番号は配列の添字そのもの。「17 番の i-node」と言えば場所が決まる。</text>
<text x="450.0" y="298" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">空き管理は第 2 章のビットマップがそのまま使える（1 ビット = 1 i-node）。</text>
<text x="450.0" y="320" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino = 0 は「無効」を表す番兵。i-node の実体はなく、ビットマップでは最初から 1 にして割り当てさせない。</text>
<text x="450.0" y="342" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">そして i-node は自分の名前を持たない。名前は第 4 章の仕事。</text>
</svg>
