<text x="566" y="170" font-size="10" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct</text>
<text x="660" y="170" font-size="10" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">[11, 0…]</text>
