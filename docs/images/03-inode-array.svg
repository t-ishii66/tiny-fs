<rect x="678" y="46" width="114" height="22" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="735.0" y="62" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">0</text>
<text x="735.0" y="88" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 5</text>
<rect x="678" y="100" width="114" height="106" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
