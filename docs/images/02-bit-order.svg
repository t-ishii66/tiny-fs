<text x="450.0" y="208" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">この例ではブロック 0,1,2,3,5,8 が使用中、4,6,7,9-15 が空き</text>
<text x="450.0" y="232" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">図は左から番号順。16 進で書くと左端が最下位ビットなので、ダンプの見た目とは左右が逆になる</text>
<text x="450.0" y="254" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">byte_index, bit_index = divmod(block_no, 8)</text>
