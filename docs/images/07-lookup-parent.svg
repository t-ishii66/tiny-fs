<svg xmlns="http://www.w3.org/2000/svg" width="900" height="324" viewBox="0 0 900 324" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>lookup と lookup_parent — 同じ道を、どこまで歩くか</title>
<rect x="0" y="0" width="900" height="324" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">lookup と lookup_parent — 同じ道を、どこまで歩くか</text>
<rect x="120" y="90" width="140" height="56" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="190" y="114" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">/</text>
<text x="190" y="134" font-size="10" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<rect x="340" y="90" width="140" height="56" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="410" y="114" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">docs</text>
<text x="410" y="134" font-size="10" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 3</text>
<rect x="560" y="90" width="140" height="56" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="630" y="114" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">a.txt</text>
<text x="630" y="134" font-size="10" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 5</text>
<path d="M 262 118 L 334 118" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="298" y="108" font-size="9.5" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">docs</text>
<path d="M 482 118 L 554 118" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="518" y="108" font-size="9.5" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">a.txt</text>
<path d="M 120 176 L 700 176" stroke="#b8860b" stroke-width="1.6" fill="none"/>
<path d="M 120 170 L 120 182" stroke="#b8860b" stroke-width="1.6" fill="none"/>
<path d="M 700 170 L 700 182" stroke="#b8860b" stroke-width="1.6" fill="none"/>
<text x="410" y="198" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">lookup("/docs/a.txt") → 5</text>
<text x="410" y="216" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">最後まで歩く。返すのは ino 1 個</text>
<path d="M 120 240 L 480 240" stroke="#3b6ea5" stroke-width="1.6" fill="none"/>
<path d="M 120 234 L 120 246" stroke="#3b6ea5" stroke-width="1.6" fill="none"/>
<path d="M 480 234 L 480 246" stroke="#3b6ea5" stroke-width="1.6" fill="none"/>
<text x="300" y="262" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">lookup_parent("/docs/a.txt") → (3, b"a.txt")</text>
<text x="300" y="280" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">最後の 1 成分を歩かずに残す</text>
<text x="700" y="262" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">create / unlink / mkdir は</text>
<text x="700" y="280" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">親とこれから付ける名前が要る</text>
<text x="450" y="312" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ルートには親がないので、lookup_parent("/") は EINVAL。</text>
</svg>
