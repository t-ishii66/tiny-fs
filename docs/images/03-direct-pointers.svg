<text x="806" y="253" font-size="10" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">未使用</text>
<path d="M 250 70.5 C 340 70.5 430 80.0 520 80.0" stroke="#3f8f52" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 250 91.5 C 340 91.5 430 192.0 520 192.0" stroke="#3f8f52" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 250 112.5 C 340 112.5 430 136.0 520 136.0" stroke="#3f8f52" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="450.0" y="354" font-size="12" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">論理オフセット off バイト目 = direct[off // 4096] 番ブロックの off % 4096 バイト目</text>
<text x="450.0" y="378" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ブロック番号は連続している必要がない（この例は 7 → 9 → 8）。間接ブロックがないので 12 本が上限 = 48 KiB</text>
</svg>
