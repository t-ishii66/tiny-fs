<text x="806" y="141" font-size="10" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ファイルの 8192 – 12287 バイト目</text>
