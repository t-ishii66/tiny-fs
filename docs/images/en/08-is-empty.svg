<svg xmlns="http://www.w3.org/2000/svg" width="900" height="356" viewBox="0 0 900 356" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>Empty means "there is no valid entry other than . and .."</title>
<rect x="0" y="0" width="900" height="356" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Empty means "there is no valid entry other than . and .."</text>
<rect x="60" y="82" width="360" height="176" rx="4" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.2"/>
<text x="240" y="106" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">After creating contents and deleting all</text>
<rect x="80" y="120" width="320" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="240" y="137" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"."    → ino 3</text>
<text x="68" y="137" font-size="8.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">0</text>
<rect x="80" y="152" width="320" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="240" y="169" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".."   → ino 1</text>
<text x="68" y="169" font-size="8.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">1</text>
<rect x="80" y="184" width="320" height="26" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.2"/>
<text x="240" y="201" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(free) → ino 0</text>
<text x="68" y="201" font-size="8.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">2</text>
<rect x="80" y="216" width="320" height="26" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.2"/>
<text x="240" y="233" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(free) → ino 0</text>
<text x="68" y="233" font-size="8.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">3</text>
<text x="240" y="286" font-size="11.5" fill="#3f8f52" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">is_empty → True (rmdir allowed)</text>
<rect x="480" y="82" width="360" height="176" rx="4" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.2"/>
<text x="660" y="106" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">1 entry still inside</text>
<rect x="500" y="120" width="320" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="660" y="137" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"."     → ino 3</text>
<text x="488" y="137" font-size="8.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">0</text>
<rect x="500" y="152" width="320" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="660" y="169" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".."    → ino 1</text>
<text x="488" y="169" font-size="8.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">1</text>
<rect x="500" y="184" width="320" height="26" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.2"/>
<text x="660" y="201" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(free)  → ino 0</text>
<text x="488" y="201" font-size="8.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">2</text>
<rect x="500" y="216" width="320" height="26" rx="2" fill="#ffedd5" stroke="#b8690b" stroke-width="1.2"/>
<text x="660" y="233" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"b.txt" → ino 7</text>
<text x="488" y="233" font-size="8.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">3</text>
<text x="660" y="286" font-size="11.5" fill="#b8690b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">is_empty → False (ENOTEMPTY)</text>
<text x="450" y="326" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">iter_entries skips slots with ino == 0. However many leftovers remain, it counts as empty.</text>
<text x="450" y="348" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Deletion does not compact slots, so size stays 4096. size cannot decide it.</text>
</svg>
