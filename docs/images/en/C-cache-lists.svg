<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>One buffer linked into two chains</title>
<rect x="0" y="0" width="900" height="404" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ea5"/></marker></defs>
<defs><marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c5cc4"/></marker></defs>
<text x="450" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">One buffer linked into two chains</text>
<text x="450" y="46" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Blue is the hash table's chain (check whether it is on it), purple the LRU chain (choose who to evict)</text>
<text x="40" y="82" font-size="11.5" fill="#3b6ea5" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Hash table</text>
<text x="40" y="98" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">looked up by block number</text>
<rect x="40" y="112" width="104" height="30" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="92" y="132" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bucket 0</text>
<rect x="40" y="158" width="104" height="30" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="92" y="178" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bucket 1</text>
<rect x="40" y="204" width="104" height="30" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="92" y="224" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bucket 2</text>
<rect x="40" y="250" width="104" height="30" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="92" y="270" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bucket 3</text>
<text x="300" y="82" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Buffers (4096-byte containers)</text>
<rect x="300" y="100" width="232" height="52" rx="2" fill="#fde8c8" stroke="#c88a2e" stroke-width="1.4"/>
<text x="316" y="122" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 7</text>
<text x="316" y="140" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">dirty</text>
<rect x="300" y="164" width="232" height="52" rx="2" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.4"/>
<text x="316" y="186" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 3</text>
<text x="316" y="204" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">clean</text>
<rect x="300" y="228" width="232" height="52" rx="2" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.4"/>
<text x="316" y="250" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 11</text>
<text x="316" y="268" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">clean</text>
<rect x="300" y="304" width="232" height="52" rx="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="316" y="326" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">(free)</text>
<text x="316" y="344" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">holds no block</text>
<path d="M 146 127 L 296 122" fill="none" stroke="#3b6ea5" stroke-width="1.6" marker-end="url(#h)"/>
<path d="M 146 173 L 296 186" fill="none" stroke="#3b6ea5" stroke-width="1.6" marker-end="url(#h)"/>
<path d="M 300 206 L 278 206 L 278 250 L 296 250" fill="none" stroke="#3b6ea5" stroke-width="1.6" marker-end="url(#h)"/>
<text x="196" y="224" font-size="9" fill="#3b6ea5" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">block 3 and block 11 have</text>
<text x="196" y="238" font-size="9" fill="#3b6ea5" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">same hash value (bucket 1)</text>
<text x="92" y="296" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">buckets 2, 3 empty</text>
<text x="560" y="82" font-size="11.5" fill="#7c5cc4" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">LRU chain</text>
<text x="560" y="98" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">In fact linked both ways</text>
<path d="M 544 126 L 560 126 L 560 182 L 544 182" fill="none" stroke="#7c5cc4" stroke-width="1.6" marker-end="url(#l)"/>
<path d="M 544 190 L 560 190 L 560 246 L 544 246" fill="none" stroke="#7c5cc4" stroke-width="1.6" marker-end="url(#l)"/>
<text x="576" y="122" font-size="9.5" fill="#7c5cc4" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">head — recently used</text>
<text x="576" y="254" font-size="9.5" fill="#7c5cc4" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">tail — eviction candidate</text>
<text x="576" y="190" font-size="9.5" fill="#7c5cc4" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Older in this order</text>
<text x="576" y="318" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Free list</text>
<text x="576" y="336" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Holds no block number, so</text>
<text x="576" y="350" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">so it is in no bucket</text>
<path d="M 572 330 L 548 330" fill="none" stroke="#d0d7de" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="40" y1="372" x2="860" y2="372" stroke="#d0d7de" stroke-width="1"/>
<text x="450" y="394" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">block 3 is linked into both chains at once. For either chain, only the head or the tail needs looking at.</text>
</svg>
