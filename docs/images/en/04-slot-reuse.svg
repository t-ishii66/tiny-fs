<text x="690" y="101" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">size = 4096</text>
<text x="130" y="175" font-size="12" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">(2) delete b.txt</text>
<rect x="146" y="148" width="102" height="44" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="197.0" y="167" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">.</text>
<text x="197.0" y="183" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<rect x="254" y="148" width="102" height="44" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="305.0" y="167" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">..</text>
<text x="305.0" y="183" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<rect x="362" y="148" width="102" height="44" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="413.0" y="167" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">a.txt</text>
<text x="413.0" y="183" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 5</text>
<rect x="470" y="148" width="102" height="44" rx="2" fill="#fee2e2" stroke="#c05252" stroke-width="2.2"/>
<text x="521.0" y="167" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(free)</text>
<text x="521.0" y="183" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 0</text>
<rect x="578" y="148" width="102" height="44" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="629.0" y="167" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">c.txt</text>
<text x="629.0" y="183" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 7</text>
<text x="690" y="175" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">size stays 4096</text>
<text x="130" y="249" font-size="12" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">(3) create d.txt</text>
<rect x="146" y="222" width="102" height="44" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="197.0" y="241" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">.</text>
<text x="197.0" y="257" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<rect x="254" y="222" width="102" height="44" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="305.0" y="241" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">..</text>
<text x="305.0" y="257" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<rect x="362" y="222" width="102" height="44" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="413.0" y="241" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">a.txt</text>
<text x="413.0" y="257" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 5</text>
<rect x="470" y="222" width="102" height="44" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="2.2"/>
<text x="521.0" y="241" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">d.txt</text>
<text x="521.0" y="257" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 8</text>
<rect x="578" y="222" width="102" height="44" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="629.0" y="241" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">c.txt</text>
<text x="629.0" y="257" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 7</text>
<text x="690" y="249" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Reuse the free slot</text>
<text x="450.0" y="292" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Deleting does not move the slot positions of the remaining entries. The emptied slot is reused as it is by the next addition.</text>
<text x="450.0" y="314" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">128 slots are prepared when the block is allocated. The figure shows the first 5.</text>
