<text x="521.0" y="93" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">b.txt</text>
<text x="521.0" y="109" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 6</text>
<text x="521.0" y="66" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">slot 3</text>
<rect x="578" y="74" width="102" height="44" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
