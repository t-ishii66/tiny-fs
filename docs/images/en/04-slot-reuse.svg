<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>No compaction</title>
<rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6fc4"/></marker></defs>
<text x="450.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Removal does not compact the entries; it only writes ino = 0</text>
<text x="130" y="101" font-size="12" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">(1) Create 3 files</text>
<rect x="146" y="74" width="102" height="44" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="197.0" y="93" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">.</text>
<text x="197.0" y="109" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<text x="197.0" y="66" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">slot 0</text>
<rect x="254" y="74" width="102" height="44" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="305.0" y="93" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">..</text>
<text x="305.0" y="109" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<text x="305.0" y="66" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">slot 1</text>
<rect x="362" y="74" width="102" height="44" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="413.0" y="93" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">a.txt</text>
<text x="413.0" y="109" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 5</text>
<text x="413.0" y="66" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">slot 2</text>
