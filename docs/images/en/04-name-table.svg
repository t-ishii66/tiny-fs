<svg xmlns="http://www.w3.org/2000/svg" width="900" height="282" viewBox="0 0 900 282" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>The contents of a directory file are a table mapping names to i-node numbers</title>
<rect x="0" y="0" width="900" height="282" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6fc4"/></marker></defs>
<text x="450.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">The contents of a directory file — a table mapping names to i-node numbers</text>

<text x="60" y="62" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">The contents of the directory file "/" (i-node 1)</text>
<rect x="60" y="72" width="300" height="26" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<path d="M 150 74 l 0 22" stroke="#c9ced4" stroke-width="1"/>
<text x="162" y="89" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Name</text>
<text x="72" y="89" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node number</text>

<rect x="60" y="98" width="300" height="32" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<path d="M 150 101 l 0 26" stroke="#c9ced4" stroke-width="1"/>
<text x="162" y="119" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"memo.txt"</text>
<text x="72" y="119" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">5</text>

<rect x="60" y="130" width="300" height="32" rx="2" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<path d="M 150 133 l 0 26" stroke="#c9ced4" stroke-width="1"/>
<text x="162" y="151" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"docs"</text>
<text x="72" y="151" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">3</text>

<text x="60" y="186" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Names are written only inside this table.</text>
<text x="60" y="203" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">On disk the order is the same (i-node number → name).</text>
<text x="60" y="220" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">A row's size is decided in §2.</text>

<path d="M 366 114 L 452 114" stroke="#5b6fc4" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 366 146 L 452 190" stroke="#5b6fc4" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

<rect x="458" y="92" width="382" height="46" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="470" y="111" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">i-node 5 — an ordinary file</text>
<text x="470" y="128" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The contents are bytes in a data block (chapter 3)</text>

<rect x="458" y="166" width="382" height="100" rx="3" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="470" y="185" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">i-node 3 — also a directory file</text>
<text x="470" y="202" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Same shape of table inside → becomes a hierarchy</text>
<rect x="470" y="212" width="250" height="28" rx="2" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/>
<path d="M 540 214 l 0 24" stroke="#c9ced4" stroke-width="1"/>
<text x="552" y="231" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"plan.md"</text>
<text x="482" y="231" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">8</text>
<text x="470" y="256" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">This is the second level of /docs/plan.md</text>
</svg>
