<svg xmlns="http://www.w3.org/2000/svg" width="900" height="368" viewBox="0 0 900 368" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>Only the driver is written per device</title>
<rect x="0" y="0" width="900" height="368" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Only the driver is written per device</text>
<rect x="260" y="66" width="420" height="76" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="470" y="90" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Kernel</text>
<text x="470" y="110" font-size="10" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">File system / page cache / block layer</text>
<text x="470" y="130" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Talks only in sector numbers and 512 bytes</text>
<rect x="260" y="190" width="420" height="62" rx="3" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="470" y="216" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Device driver</text>
<text x="470" y="236" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The only place that knows this device's ways and its completion interrupt</text>
<rect x="260" y="300" width="420" height="52" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="470" y="322" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Device</text>
<text x="470" y="340" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Read / write sectors</text>
<path d="M 240 66 L 240 142" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<path d="M 240 66 L 248 66" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<path d="M 240 142 L 248 142" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<text x="228" y="100" font-size="10" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">for any device</text>
<text x="228" y="118" font-size="10" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">same code</text>
<path d="M 240 190 L 240 252" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<path d="M 240 190 L 248 190" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<path d="M 240 252 L 248 252" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<text x="228" y="217" font-size="10" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">For this device</text>
<text x="228" y="235" font-size="10" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">code written</text>
<path d="M 340 146 L 340 186" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="326" y="170" font-size="10" fill="#b8860b" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">request</text>
<path d="M 340 256 L 340 296" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="326" y="280" font-size="10" fill="#b8860b" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Command</text>
<path d="M 600 296 L 600 256" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="614" y="280" font-size="10" fill="#b8860b" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">interrupt</text>
<path d="M 600 186 L 600 146" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="614" y="170" font-size="10" fill="#b8860b" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">completion</text>
<text x="700" y="216" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">tiny-fs's device.py</text>
<text x="700" y="234" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">draws its boundary</text>
</svg>
