<text x="110" y="62" font-size="10" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node bitmap</text>
<text x="100" y="153.0" font-size="11" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node table</text>
<text x="792" y="157.0" font-size="18" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">⋯</text>
<text x="792" y="62" font-size="16" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">⋯</text>
<text x="495.0" y="232" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Exactly 32 of them fit in 1 block (4096 B) (4096 ÷ 128)</text>
<text x="450.0" y="276" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The position in the array can be computed from the i-node number. Say "i-node 17" and the place is fixed.</text>
<text x="450.0" y="298" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Free-space management can use chapter 2's bitmap as it is (1 bit = 1 i-node).</text>
<text x="450.0" y="320" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino = 0 is a sentinel meaning "invalid". It has no i-node substance, and the bitmap sets it to 1 from the start so it is never allocated.</text>
<text x="450.0" y="342" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">And an i-node does not hold its own name. Names are chapter 4's job.</text>
</svg>
