<text x="450.0" y="262" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">This is as far as the word sector appears. The layers above see only block numbers.</text>
