<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>mkdir("/docs") — the names added, and the parent's nlink</title>
<rect x="0" y="0" width="900" height="404" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">mkdir("/docs") — three names are added</text>
<rect x="40" y="86" width="300" height="200" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="190" y="112" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Parent / (ino 1)</text>
<text x="190" y="136" font-size="11" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">nlink = 2 → 3</text>
<rect x="56" y="154" width="268" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="190" y="171" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"."    → ino 1</text>
<rect x="56" y="190" width="268" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="190" y="207" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".."   → ino 1</text>
<rect x="56" y="226" width="268" height="26" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.2"/>
<text x="190" y="243" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"docs" → ino 3</text>
<text x="48" y="243" font-size="10" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(1)</text>
<rect x="560" y="86" width="300" height="200" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="710" y="112" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">New /docs (ino 3)</text>
<text x="710" y="136" font-size="11" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">nlink = 2</text>
<rect x="576" y="154" width="268" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="710" y="171" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"."  → ino 3</text>
<text x="832" y="171" font-size="9" fill="#b8860b" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">points at self</text>
<text x="568" y="171" font-size="10" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(2)</text>
<rect x="576" y="190" width="268" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="710" y="207" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".." → ino 1</text>
<text x="568" y="207" font-size="10" fill="#3b6ea5" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(3)</text>
<rect x="576" y="226" width="268" height="26" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.2"/>
<text x="710" y="243" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(free)</text>
<path d="M 330 239 C 430 239 450 132 552 118" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="455" y="212" font-size="10" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">(1) "docs" in parent</text>
<path d="M 570 207 C 480 207 450 128 344 116" stroke="#3b6ea5" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="455" y="146" font-size="10" fill="#3b6ea5" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">(3) child's ".."</text>
<text x="190" y="306" font-size="10.5" fill="#3b6ea5" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">1 more name points at ino 1 → nlink +1</text>
<text x="710" y="306" font-size="10.5" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">2 names point at ino 3, (1) and (2) → nlink = 2</text>
<text x="710" y="326" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Take one data block → size = 4096</text>
<text x="450" y="366" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">nlink is "the number of names pointing at that i-node". "." and ".." count as names too (chapter 4).</text>
<text x="450" y="390" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">If it fails partway, one free_inode frees it. Both the block and the i-node number come back.</text>
</svg>
