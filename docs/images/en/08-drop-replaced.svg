<svg xmlns="http://www.w3.org/2000/svg" width="900" height="492" viewBox="0 0 900 492" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>Tidying up an i-node that lost its name</title>
<rect x="0" y="0" width="900" height="492" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">rename("/a", "/b") cleanup — tidying up the i-node that lost its name</text>
<text x="40" y="68" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">When the renaming has finished</text>
<rect x="40" y="80" width="370" height="112" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="225" y="102" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Names (dirent)</text>
<rect x="56" y="112" width="338" height="30" rx="2" fill="#fff7ed" stroke="#b8690b" stroke-width="1.2"/>
<text x="70" y="132" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"b" → ino 5</text>
<text x="382" y="132" font-size="8.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">replaced</text>
<rect x="56" y="150" width="338" height="30" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.2"/>
<text x="70" y="170" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"a" → ino 0</text>
<text x="382" y="170" font-size="8.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">old name removed</text>
<rect x="490" y="80" width="370" height="112" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="675" y="102" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node</text>
<rect x="506" y="112" width="338" height="30" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.2"/>
<text x="520" y="132" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino 5 (was /a)</text>
<text x="832" y="132" font-size="8.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">1 name</text>
<rect x="506" y="150" width="338" height="30" rx="2" fill="#fff7ed" stroke="#b8690b" stroke-width="1.2"/>
<text x="520" y="170" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino 9 (what /b was)</text>
<text x="832" y="170" font-size="8.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">0 names ← the one to tidy up</text>
<path d="M 416 127 L 500 127" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="458" y="118" font-size="9" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">points to</text>
<text x="450" y="216" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">This ino 9 is the one to tidy up. Its contents are still the old /b; only the name is gone.</text>
<path d="M 40 240 L 860 240" stroke="#e1e4e8" stroke-width="1.2" fill="none"/>
<rect x="340" y="262" width="220" height="52" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="450" y="284" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">Is ino 9</text>
<text x="450" y="302" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">a directory?</text>
<path d="M 400 318 L 250 350" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="150" y="342" font-size="10" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Yes (checked to be empty)</text>
<path d="M 500 318 L 650 350" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="760" y="342" font-size="10" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">No (a file)</text>
<rect x="40" y="356" width="380" height="112" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="230" y="380" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Only its own "." remains</text>
<text x="230" y="406" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">free_inode(...)</text>
<text x="230" y="428" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">zero-fill the 128 bytes</text>
<text x="230" y="452" font-size="10.5" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">new_parent.nlink -= 1</text>
<rect x="480" y="356" width="380" height="112" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="670" y="382" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">nlink -= 1</text>
<text x="670" y="410" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Became 0 → free_inode and zero-fill</text>
<text x="670" y="434" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Still remains → just write_inode</text>
<text x="670" y="458" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">exactly the same as unlink</text>
<text x="450" y="486" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Only on the directory side is the parent's nlink decremented, because ino 9's "." no longer points at it.</text>
</svg>
