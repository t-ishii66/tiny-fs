<rect x="106.0" y="136" width="14" height="16" rx="1" fill="#fdba74" stroke="#b8690b" stroke-width="1"/>
<rect x="122.0" y="136" width="14" height="16" rx="1" fill="#ffffff" stroke="#d8b48c" stroke-width="1"/>
<rect x="138.0" y="136" width="14" height="16" rx="1" fill="#fdba74" stroke="#b8690b" stroke-width="1"/>
<text x="155.0" y="148" font-size="12" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">⋯</text>
<rect x="190.0" y="136" width="14" height="16" rx="1" fill="#c4b5fd" stroke="#7c5cc4" stroke-width="1"/>
<rect x="206.0" y="136" width="14" height="16" rx="1" fill="#c4b5fd" stroke="#7c5cc4" stroke-width="1"/>
<rect x="222.0" y="136" width="14" height="16" rx="1" fill="#ffffff" stroke="#c0b0e8" stroke-width="1"/>
<rect x="238.0" y="136" width="14" height="16" rx="1" fill="#c4b5fd" stroke="#7c5cc4" stroke-width="1"/>
<rect x="254.0" y="136" width="14" height="16" rx="1" fill="#ffffff" stroke="#c0b0e8" stroke-width="1"/>
<rect x="270.0" y="136" width="14" height="16" rx="1" fill="#ffffff" stroke="#c0b0e8" stroke-width="1"/>
<text x="287.0" y="148" font-size="12" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">⋯</text>
<rect x="307.0" y="132" width="66.0" height="20" rx="1" fill="#dcfce7" stroke="#3f8f52" stroke-width="1"/>
<text x="340.0" y="146" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">32 of them</text>
<rect x="379.0" y="132" width="66.0" height="20" rx="1" fill="#dcfce7" stroke="#3f8f52" stroke-width="1"/>
<text x="412.0" y="146" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">32 of them</text>
<rect x="451.0" y="132" width="66.0" height="20" rx="1" fill="#dcfce7" stroke="#3f8f52" stroke-width="1"/>
<text x="484.0" y="146" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">32 of them</text>
<rect x="523.0" y="132" width="66.0" height="20" rx="1" fill="#dcfce7" stroke="#3f8f52" stroke-width="1"/>
<text x="556.0" y="146" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">32 of them</text>
<path d="M 106.0 166 L 106.0 216 L 742.0 216 L 742.0 168" stroke="#b8690b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="356.0" y="212" font-size="11" fill="#b8690b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">1 bit = 1 data block</text>
<path d="M 238.0 166 L 238.0 182 L 448.0 182 L 448.0 168" stroke="#7c5cc4" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="348.0" y="174" font-size="11" fill="#7c5cc4" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">1 bit = 1 i-node</text>
<text x="450.0" y="242" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Just two bitmaps of the same mechanism manage both free blocks and free i-nodes.</text>
<text x="450.0" y="266" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The i-node table is 128 ÷ 32 = 4 blocks. 32 per block, with no gaps.</text>
<text x="450.0" y="290" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Which block goes where is decided in chapter 5.</text>
</svg>
