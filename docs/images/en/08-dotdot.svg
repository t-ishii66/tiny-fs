<svg xmlns="http://www.w3.org/2000/svg" width="900" height="336" viewBox="0 0 900 336" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>Forget to reattach ".." and cd .. returns to the old parent</title>
<rect x="0" y="0" width="900" height="336" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Forget to reattach ".." and cd .. returns to the old parent</text>
<text x="40" y="74" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">After mv /docs /archive/docs, /archive/docs looks like this</text>
<text x="40" y="126" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Correct</text>
<rect x="220" y="100" width="240" height="52" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="340" y="132" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".." → ino 4</text>
<path d="M 466 126 L 516 126" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="520" y="100" width="260" height="52" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="650" y="132" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">cd .. comes out at /archive</text>
<text x="800" y="132" font-size="10.5" fill="#3f8f52" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Matches tree</text>
<text x="40" y="242" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Reattachment forgotten</text>
<rect x="220" y="216" width="240" height="52" rx="3" fill="#fff7ed" stroke="#b8690b" stroke-width="1.5"/>
<text x="340" y="248" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".." → ino 1</text>
<path d="M 466 242 L 516 242" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="520" y="216" width="260" height="52" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="650" y="248" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">cd .. goes back to /</text>
<text x="800" y="248" font-size="10.5" fill="#b8690b" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Contradicts tree</text>
<text x="450" y="308" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">A step only a moved directory has. On a rename within the same parent, ".." does not change.</text>
<text x="450" y="330" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">±1 on both parents' nlink, too, only when the parent changes.</text>
</svg>
