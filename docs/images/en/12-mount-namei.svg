<text x="621" y="132" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">docs</text>
<text x="621" y="152" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino 3</text>
<rect x="708" y="108" width="132" height="56" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="774" y="132" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">a.txt</text>
<text x="774" y="152" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino 5</text>
