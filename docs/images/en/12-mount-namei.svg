<path d="M 394 200 L 440 230" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="300" y="236" width="300" height="56" rx="3" fill="#fff7ed" stroke="#b8690b" stroke-width="1.5"/>
<text x="450" y="258" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">On arriving at the mount point,</text>
<text x="450" y="276" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">switch over to tiny-fs's root (ino 1)</text>
<text x="450" y="322" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">What tiny-fs receives is /docs/a.txt. The starting point is its own root, and chapter 6's procedure works as is.</text>
<text x="450" y="344" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Both FSs have an ino 1, and a clash of numbers causes no trouble.</text>
