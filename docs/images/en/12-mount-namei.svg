<text x="297" y="132" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">mnt</text>
<text x="297" y="152" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">a name inside ext4</text>
<rect x="384" y="108" width="150" height="56" rx="3" fill="#fff7ed" stroke="#b8690b" stroke-width="1.5"/>
<text x="459" y="132" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">tiny-fs</text>
<text x="459" y="152" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">mount point</text>
