<path d="M 376 136 L 386 136" stroke="#b8860b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 538 136 L 548 136" stroke="#b8860b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 700 136 L 710 136" stroke="#b8860b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 60 92 L 534 92" stroke="#8b949e" stroke-width="1.4" fill="none"/>
<path d="M 60 92 L 60 100" stroke="#8b949e" stroke-width="1.4" fill="none"/>
