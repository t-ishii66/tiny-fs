<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>Removing a name and removing the substance differ</title>
<rect x="0" y="0" width="900" height="344" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Removing a name and removing the substance differ</text>
<rect x="50" y="80" width="220" height="64" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="160" y="106" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Remove name from parent</text>
<text x="160" y="128" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">dirent.ino = 0</text>
<path d="M 276 112 L 328 112" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="334" y="80" width="180" height="64" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="424" y="112" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">nlink -= 1</text>
<path d="M 520 112 L 572 112" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="578" y="80" width="200" height="64" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="678" y="112" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">nlink == 0 ?</text>
<path d="M 640 148 L 470 186" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="520" y="168" font-size="10" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">No</text>
<path d="M 716 148 L 760 186" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="770" y="168" font-size="10" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Yes</text>
<rect x="300" y="190" width="240" height="92" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="420" y="216" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">write_inode(ino, inode)</text>
<text x="420" y="242" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The substance remains</text>
<text x="420" y="264" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">another name still points at it</text>
<rect x="600" y="190" width="260" height="92" rx="3" fill="#fff7ed" stroke="#b8690b" stroke-width="1.5"/>
<text x="730" y="216" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">free_inode(...)</text>
<text x="730" y="242" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Return the blocks and ino to free</text>
<text x="730" y="264" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Zero-fill the 128 bytes</text>
<text x="450" y="316" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">tiny-fs does not implement link(), so a file always goes 1 → 0.</text>
<text x="450" y="338" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Only directories start with nlink = 2 (because . points at itself. Chapter 8).</text>
</svg>
