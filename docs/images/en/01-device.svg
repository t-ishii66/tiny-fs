<text x="450.0" y="176" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Reads and writes are always in units of 512 bytes. Pick a box by sector number, and read it whole or write it whole.</text>
<text x="450.0" y="198" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Neither "write less than 512 bytes" nor "insert in the middle" exists.</text>
