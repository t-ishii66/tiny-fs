<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>When the image is opened, only 3 blocks are read from the disk</title>
<rect x="0" y="0" width="900" height="410" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">When the image is opened, only 3 blocks are read from the disk</text>
<text x="40" y="58" font-size="12" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">disk.img (on disk)</text>
<rect x="96" y="76" width="224" height="44" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="88" y="104" font-size="11" fill="#57606a" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">0</text>
<text x="208" y="104" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Superblock</text>
<rect x="96" y="126" width="224" height="44" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="88" y="154" font-size="11" fill="#57606a" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">1</text>
<text x="208" y="154" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Data block bitmap</text>
<rect x="96" y="176" width="224" height="44" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="88" y="204" font-size="11" fill="#57606a" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">2</text>
<text x="208" y="204" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node bitmap</text>
<rect x="96" y="226" width="224" height="44" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="88" y="254" font-size="11" fill="#57606a" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">3 – 6</text>
<text x="208" y="254" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node table</text>
<rect x="96" y="276" width="224" height="44" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="88" y="304" font-size="11" fill="#57606a" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">7 – 1023</text>
<text x="208" y="304" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Data blocks</text>
<text x="470" y="58" font-size="12" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">FileSystem (in memory)</text>
<rect x="470" y="66" width="390" height="262" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="486" y="84" width="358" height="68" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="502" y="108" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">self._sb</text>
<text x="502" y="130" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The 8 values decoded from block 0</text>
<text x="502" y="148" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Position computation starts here</text>
<rect x="486" y="168" width="358" height="68" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="502" y="192" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">self.blocks_alloc</text>
<text x="502" y="214" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">a copy of block 1's 4096 bytes</text>
<text x="502" y="228" font-size="9.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">capacity = total_blocks</text>
<rect x="486" y="252" width="358" height="68" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="502" y="276" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">self.inodes_alloc</text>
<text x="502" y="298" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">A copy of block 2's 4096 bytes</text>
<text x="502" y="312" font-size="9.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">capacity = num_inodes + 1</text>
<path d="M 322 98 C 400 98 400 118 480 118" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M 322 148 C 400 148 400 202 480 202" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M 322 198 C 400 198 400 286 480 286" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="450" y="364" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The i-node table and the data blocks are not read at open time. read_block happens when needed.</text>
<text x="450" y="390" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">_check_superblock() compares magic and each value against constants.py. If they do not match, it dies without mounting.</text>
</svg>
