<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>The road for reading one page — a hit and a miss</title>
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3f8f52"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4413c"/></marker></defs>
<text x="450.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">The road for reading one page — a hit and a miss</text>
<rect x="40" y="100" width="120" height="48" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="100" y="130" font-size="9" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">read(fd, buf, 4096)</text>
<path d="M 164 124 L 212 124" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="216" y="96" width="150" height="56" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="291" y="120" font-size="10" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">In the page cache</text>
<text x="291" y="138" font-size="10" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">is it on it?</text>
<path d="M 370 112 L 430 76" stroke="#3f8f52" stroke-width="1.5" fill="none" marker-end="url(#g)"/>
<text x="400" y="66" font-size="9.5" fill="#3f8f52" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Hit</text>
<rect x="434" y="52" width="330" height="44" rx="3" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="448" y="80" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Copy that page and return it. The device is not touched</text>
<path d="M 370 140 L 430 176" stroke="#b8860b" stroke-width="1.5" fill="none" marker-end="url(#y)"/>
<text x="398" y="182" font-size="9.5" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">miss</text>
<rect x="434" y="156" width="150" height="44" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="509" y="176" font-size="10" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Is the cache</text>
<text x="509" y="192" font-size="10" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Full?</text>
<path d="M 588 166 L 636 140" stroke="#b4413c" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
<text x="612" y="132" font-size="9.5" fill="#b4413c" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">full</text>
<rect x="640" y="116" width="220" height="36" rx="3" fill="#fde8c8" stroke="#b8860b" stroke-width="1.5"/>
<text x="654" y="139" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Release one (§5 figure)</text>
<path d="M 588 190 L 636 212" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="612" y="228" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Has room</text>
<rect x="640" y="196" width="220" height="36" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="654" y="219" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">read from device and put it on</text>
<path d="M 750 152 L 750 192" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="450" y="276" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">write(2) has the same shape. The difference: it rewrites the page and sets the "dirty" flag, and writes nothing to the device.</text>
</svg>
