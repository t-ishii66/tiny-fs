<text x="596.0" y="108" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 3</text>
<rect x="670" y="74" width="132" height="42" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="736.0" y="93" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"memo.txt"</text>
<text x="736.0" y="108" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 6</text>
<path d="M 596.0 120 l 0 14" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="596.0" y="148" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">"docs" matches → ino = 3</text>
<text x="30" y="226" font-size="12.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">(2) now at /docs</text>
<text x="30" y="246" font-size="11" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 3</text>
<text x="30" y="264" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">remaining: a.txt</text>
<text x="250" y="196" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">This i-node's contents (linear search of dirents from the start)</text>
<rect x="250" y="206" width="132" height="42" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="316.0" y="225" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"."</text>
<text x="316.0" y="240" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 3</text>
<rect x="390" y="206" width="132" height="42" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="456.0" y="225" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".."</text>
<text x="456.0" y="240" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 1</text>
<rect x="530" y="206" width="132" height="42" rx="2" fill="#fde68a" stroke="#b8860b" stroke-width="2.2"/>
<text x="596.0" y="225" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"a.txt"</text>
<text x="596.0" y="240" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 5</text>
<path d="M 596.0 252 l 0 14" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="596.0" y="280" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">"a.txt" matches → ino = 5</text>
<text x="30" y="360" font-size="12.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">(3) no components left</text>
<rect x="250" y="338" width="300" height="44" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="400" y="365" font-size="13" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">/docs/a.txt = ino 5</text>
<text x="570" y="365" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Read this ino's i-node and you get both contents and attributes</text>
<text x="450.0" y="418" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The processing is only a repeat of "look up the name in the current directory, move to the ino you get".</text>
<text x="450.0" y="440" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">"." and ".." really exist as dirents, so no special handling is needed.</text>
</svg>
