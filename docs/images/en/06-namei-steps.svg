<text x="250" y="64" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">This i-node's contents (linear search of dirents from the start)</text>
