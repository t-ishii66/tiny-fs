<svg xmlns="http://www.w3.org/2000/svg" width="900" height="514" viewBox="0 0 900 514" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>write() changes the in-memory copy, and the disk catches up via write_inode</title>
<rect x="0" y="0" width="900" height="514" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">The 3 stages of write("/a.txt", 0, 5000 bytes)</text>
<text x="450.0" y="46" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Only the i-node and the bitmaps are in memory. When things reach the disk differs by stage</text>
<text x="282.5" y="78" font-size="13" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">(1)</text>
<text x="282.5" y="96" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">read_inode(ino)</text>
<text x="527.5" y="78" font-size="13" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">(2)</text>
<text x="527.5" y="96" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">inode_mod.write(...)</text>
<text x="772.5" y="78" font-size="13" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">(3)</text>
<text x="772.5" y="96" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">write_inode(ino, inode)</text>
<text x="158" y="138" font-size="11" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Memory</text>
<text x="158" y="155" font-size="9.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node copy</text>
<rect x="170" y="112" width="225" height="86" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="282.5" y="138" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size = 0</text>
<text x="282.5" y="158" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[] = 0, 0, ...</text>
<text x="282.5" y="184" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The copy read_inode made</text>
<rect x="415" y="112" width="225" height="86" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="527.5" y="138" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size = 5000</text>
<text x="527.5" y="158" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[0] = 8, direct[1] = 9</text>
<text x="527.5" y="184" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">only the copy is rewritten</text>
<rect x="660" y="112" width="225" height="86" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="772.5" y="138" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size = 5000</text>
<text x="772.5" y="158" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[0] = 8, direct[1] = 9</text>
<text x="772.5" y="184" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">encode() and write out</text>
<text x="158" y="242" font-size="11" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Memory</text>
<text x="158" y="259" font-size="9.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">2 bitmap blocks</text>
<rect x="170" y="216" width="225" height="86" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="282.5" y="242" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">no change</text>
<text x="282.5" y="288" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">As read at mount time</text>
<rect x="415" y="216" width="225" height="86" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="527.5" y="242" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bit 8, 9 = 1</text>
<text x="527.5" y="288" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Right after the change, all 4096 bytes are written back</text>
<rect x="660" y="216" width="225" height="86" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="772.5" y="242" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">no change</text>
<text x="772.5" y="288" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">not touched at this stage</text>
<text x="158" y="346" font-size="11" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">Disk</text>
<text x="158" y="363" font-size="9.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Image contents</text>
<rect x="170" y="320" width="225" height="86" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="282.5" y="346" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">no change</text>
<text x="282.5" y="392" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Read only</text>
<rect x="415" y="320" width="225" height="86" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="527.5" y="346" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">data enters block 8, 9</text>
<text x="527.5" y="366" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">The bitmap blocks are written back too</text>
<text x="527.5" y="392" font-size="10" fill="#b4413c" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">The i-node table still has size = 0</text>
<rect x="660" y="320" width="225" height="86" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="772.5" y="346" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">the i-node table (block 3)</text>
<text x="772.5" y="366" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">changes to size = 5000</text>
<text x="772.5" y="392" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Now the disk catches up</text>
<path d="M 397 155.0 L 411 155.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 642 155.0 L 656 155.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 397 259.0 L 411 259.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 642 259.0 L 656 259.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 397 363.0 L 411 363.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 642 363.0 L 656 363.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 405.0 62 L 405.0 141.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 405.0 169.0 L 405.0 245.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 405.0 273.0 L 405.0 349.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 405.0 377.0 L 405.0 416" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 650.0 62 L 650.0 141.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 650.0 169.0 L 650.0 245.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 650.0 273.0 L 650.0 349.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 650.0 377.0 L 650.0 416" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<rect x="40" y="432" width="820" height="62" rx="4" fill="#fff7ed" stroke="#b8690b" stroke-width="1.5"/>
<text x="60" y="458" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Even if ENOSPC happens partway through (2), block 8 is already allocated. Raise without writing the i-node and an in-use block nobody points at is left behind.</text>
<text x="60" y="480" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">So even on failure, call write_inode before raising. Forget (3) and a file with size = 0 appears when you mount again.</text>
</svg>
