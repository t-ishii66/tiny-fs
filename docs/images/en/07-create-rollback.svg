<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>If create fails partway through, free the i-node that was allocated</title>
<rect x="0" y="0" width="900" height="366" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">If create fails partway through, free the i-node that was allocated</text>
<rect x="40" y="80" width="190" height="64" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="135" y="106" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">(1) take one i-node</text>
<text x="135" y="128" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">inodes_alloc.allocate()</text>
<rect x="250" y="80" width="190" height="64" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="345" y="106" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">(2) Write to the table</text>
<text x="345" y="128" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">write_inode(5, inode)</text>
<rect x="460" y="80" width="190" height="64" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="555" y="106" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">(3) Add name to parent</text>
<text x="555" y="128" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">add_entry(...)</text>
<rect x="670" y="80" width="190" height="64" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="765" y="106" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">(4) update parent times</text>
<text x="765" y="128" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">Success. Return ino 5</text>
<path d="M 234 112 L 246 112" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 444 112 L 456 112" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 654 112 L 666 112" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 555 148 L 555 182" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="575" y="172" font-size="10" fill="#b8860b" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Fails with EEXIST / ENOSPC</text>
<rect x="420" y="186" width="270" height="100" rx="3" fill="#fff7ed" stroke="#b8690b" stroke-width="1.5"/>
<text x="555" y="212" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">write_inode(5, Inode.empty())</text>
<text x="555" y="236" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">inodes_alloc.mark_free(5)</text>
<text x="555" y="262" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">raise</text>
<path d="M 414 240 L 260 240" stroke="#b8860b" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
<text x="40" y="218" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">(1) and (2)</text>
<text x="40" y="238" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">are undone as is</text>
<text x="40" y="264" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Both bit and 128 bytes</text>
<text x="40" y="282" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Back to the shape before create</text>
<text x="450" y="326" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Forget to give it back and 1 i-node stays in use although nothing references it.</text>
<text x="450" y="350" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">This is the breakage fsck (chapter 10) detects as an orphan i-node.</text>
</svg>
