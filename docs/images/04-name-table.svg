<svg xmlns="http://www.w3.org/2000/svg" width="900" height="282" viewBox="0 0 900 282" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>ディレクトリファイルの中身は、名前と i-node 番号の対応表</title>
<rect x="0" y="0" width="900" height="282" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6fc4"/></marker></defs>
<text x="450.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">ディレクトリファイルの中身 — 名前と i-node 番号の対応表</text>

<text x="60" y="62" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ディレクトリファイル "/" （i-node 1）の中身</text>
<rect x="60" y="72" width="300" height="26" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<path d="M 240 74 l 0 22" stroke="#c9ced4" stroke-width="1"/>
<text x="72" y="89" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">名前</text>
<text x="252" y="89" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node 番号</text>

<rect x="60" y="98" width="300" height="32" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<path d="M 240 101 l 0 26" stroke="#c9ced4" stroke-width="1"/>
<text x="72" y="119" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"memo.txt"</text>
<text x="252" y="119" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">5</text>

<rect x="60" y="130" width="300" height="32" rx="2" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<path d="M 240 133 l 0 26" stroke="#c9ced4" stroke-width="1"/>
<text x="72" y="151" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"docs"</text>
<text x="252" y="151" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">3</text>

<text x="60" y="186" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">名前が書かれているのはこの表の中だけ。</text>
<text x="60" y="203" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">表のどこに置くか、1 行を何バイトにするかは §2 以降で決める。</text>

<path d="M 366 114 L 452 114" stroke="#5b6fc4" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 366 146 L 452 190" stroke="#5b6fc4" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

<rect x="458" y="92" width="382" height="46" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="470" y="111" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">i-node 5 — 普通のファイル</text>
<text x="470" y="128" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">中身はデータブロックに入ったバイト列（第 3 章）</text>

<rect x="458" y="166" width="382" height="100" rx="3" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="470" y="185" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">i-node 3 — これもディレクトリファイル</text>
<text x="470" y="202" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">中身は同じ形の表。だから階層になる</text>
<rect x="470" y="212" width="250" height="28" rx="2" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/>
<path d="M 620 214 l 0 24" stroke="#c9ced4" stroke-width="1"/>
<text x="482" y="231" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"plan.md"</text>
<text x="632" y="231" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">8</text>
<text x="470" y="256" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">これが /docs/plan.md の 2 段目にあたる</text>
</svg>
