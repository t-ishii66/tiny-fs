<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>readdir は名前と ino、stat は i-node そのもの</title>
<rect x="0" y="0" width="900" height="390" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">readdir は名前と ino、stat は i-node そのもの</text>
<text x="40" y="76" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">readdir：データブロックを頭から読む</text>
<rect x="40" y="92" width="330" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="205" y="109" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"."     → ino 3</text>
<rect x="40" y="124" width="330" height="26" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="205" y="141" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".."    → ino 1</text>
<rect x="40" y="156" width="330" height="26" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.2"/>
<text x="205" y="173" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(空き)  → ino 0</text>
<rect x="40" y="188" width="330" height="26" rx="2" fill="#ffedd5" stroke="#b8690b" stroke-width="1.2"/>
<text x="205" y="205" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"a.txt" → ino 5</text>
<path d="M 205 224 l 0 24" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="225" y="244" font-size="10" fill="#b8860b" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino == 0 は飛ばす</text>
<rect x="40" y="252" width="330" height="92" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text xml:space="preserve" x="60" y="278" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">[(b".",     3),</text>
<text xml:space="preserve" x="60" y="302" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal"> (b"..",    1),</text>
<text xml:space="preserve" x="60" y="326" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal"> (b"a.txt", 5)]</text>
<text x="470" y="76" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">stat：Inode をそのまま返す</text>
<rect x="470" y="92" width="130" height="26" rx="2" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.2"/>
<text x="535" y="109" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">mode</text>
<path d="M 606 105 L 632 105" stroke="#b8860b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="640" y="109" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">種別とパーミッション（drwxr-xr-x）</text>
<rect x="470" y="124" width="130" height="26" rx="2" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.2"/>
<text x="535" y="141" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">nlink</text>
<path d="M 606 137 L 632 137" stroke="#b8860b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="640" y="141" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">リンク数</text>
<rect x="470" y="156" width="130" height="26" rx="2" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.2"/>
<text x="535" y="173" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">uid / gid</text>
<path d="M 606 169 L 632 169" stroke="#b8860b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="640" y="173" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">所有者</text>
<rect x="470" y="188" width="130" height="26" rx="2" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.2"/>
<text x="535" y="205" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size</text>
<path d="M 606 201 L 632 201" stroke="#b8860b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="640" y="205" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">大きさ</text>
<rect x="470" y="220" width="130" height="26" rx="2" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.2"/>
<text x="535" y="237" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">mtime</text>
<path d="M 606 233 L 632 233" stroke="#b8860b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="640" y="237" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">更新時刻</text>
<text x="470" y="288" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ls -l が必要とする列は、すべて i-node に入っている</text>
<text x="450" y="366" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">"." と ".." は dirent として実在するので、ls -a のために作り足す必要がない。</text>
<text x="450" y="388" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">どちらもディスクを 1 バイトも変えない。</text>
</svg>
