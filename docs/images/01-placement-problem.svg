<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>素朴に詰めると何が起きるか</title>
<rect x="0" y="0" width="900" height="366" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<text x="450.0" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">素朴に「先頭から詰める」とどうなるか</text>
<text x="118" y="89" font-size="10.5" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">① memo.txt を置く</text>
<rect x="132" y="64" width="90" height="40" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<rect x="222" y="64" width="390" height="40" rx="2" fill="#ffffff" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="177.0" y="89" font-size="12" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">memo.txt</text>
<text x="628" y="89" font-size="11" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">memo.txt は 0–2 番の 3 セクタ</text>
<text x="147.0" y="56" font-size="10" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">0</text>
<text x="267.0" y="56" font-size="10" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">4</text>
<text x="387.0" y="56" font-size="10" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">8</text>
<text x="507.0" y="56" font-size="10" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">12</text>
<text x="118" y="155" font-size="10.5" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">② notes.txt を置く</text>
<rect x="132" y="130" width="90" height="40" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<rect x="222" y="130" width="60" height="40" rx="2" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<rect x="282" y="130" width="330" height="40" rx="2" fill="#ffffff" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="177.0" y="155" font-size="12" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">memo.txt</text>
<text x="252.0" y="155" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">notes.txt</text>
<text x="628" y="155" font-size="11" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">notes.txt は 3–4 番</text>
<text x="118" y="221" font-size="10.5" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">③ memo.txt を消す</text>
<rect x="132" y="196" width="90" height="40" rx="2" fill="#ffffff" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="222" y="196" width="60" height="40" rx="2" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<rect x="282" y="196" width="330" height="40" rx="2" fill="#ffffff" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="252.0" y="221" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">notes.txt</text>
<text x="628" y="221" font-size="11" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">0–2 番が空いた</text>
<text x="118" y="287" font-size="10.5" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">④ log.txt を置く</text>
<rect x="132" y="262" width="90" height="40" rx="2" fill="#ffffff" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="222" y="262" width="60" height="40" rx="2" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<rect x="282" y="262" width="120" height="40" rx="2" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<rect x="402" y="262" width="210" height="40" rx="2" fill="#ffffff" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="252.0" y="287" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">notes.txt</text>
<text x="342.0" y="287" font-size="12" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">log.txt</text>
<text x="628" y="287" font-size="11" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">穴に入らないので後ろへ</text>
<text x="450.0" y="324" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">穴が残る（断片化）。しかもそれ以前に — 「memo.txt は 0–2 番」という対応を覚えているのは誰？</text>
<text x="450.0" y="346" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">プログラムが覚えていても、電源を切れば消える。</text>
</svg>
