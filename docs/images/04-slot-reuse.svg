<text x="690" y="249" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">空きスロットを再利用</text>
<text x="450.0" y="292" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">削除しても残りのエントリのスロット位置が動かないので、readdir が途中から再開しても取りこぼさない。</text>
<text x="450.0" y="314" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">スロットはブロック確保時に 128 個ぶん用意される。図はその先頭 5 個。</text>
