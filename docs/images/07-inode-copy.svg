<svg xmlns="http://www.w3.org/2000/svg" width="900" height="306" viewBox="0 0 900 306" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>read_inode と write_inode は i-node のコピーを読み出して書き戻すだけ</title>
<rect x="0" y="0" width="900" height="306" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">read_inode と write_inode は i-node のコピーを読み出して書き戻すだけ</text>
<rect x="60" y="76" width="300" height="150" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="210" y="100" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">ディスク：block 3 の 512 – 639</text>
<text x="210" y="130" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">mode = 0o100644</text>
<text x="210" y="152" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size  = 5000</text>
<text x="210" y="174" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[0] = 8, direct[1] = 9</text>
<text x="210" y="212" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">128 バイトに符号化された姿</text>
<rect x="540" y="76" width="300" height="150" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="690" y="100" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">メモリ：Inode（dataclass）</text>
<text x="690" y="130" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">mode = 0o100644</text>
<text x="690" y="152" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size  = 5000</text>
<text x="690" y="174" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[0] = 8, direct[1] = 9</text>
<text x="690" y="212" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ここを変えてもディスクは変わらない</text>
<path d="M 366 120 L 534 120" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="450" y="110" font-size="11" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">read_inode(5)</text>
<text x="450" y="138" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">Inode.decode(raw[512:640])</text>
<path d="M 534 186 L 366 186" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="450" y="176" font-size="11" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">write_inode(5, inode)</text>
<text x="450" y="204" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">read-modify-write</text>
<text x="450" y="264" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">戻す矢印（write_inode）を忘れるのが、この層で最も多い間違い。書いたはずのファイルが、次に開くと 0 バイトになる。</text>
<text x="450" y="288" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">左右の箱は別物。片方を変えても、もう片方は変わらない。</text>
</svg>
