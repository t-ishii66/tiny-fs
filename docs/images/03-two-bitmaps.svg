<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>2 枚のビットマップと i-node テーブル</title>
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<text x="450.0" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">ビットマップは 2 枚。1 枚がデータブロック用、もう 1 枚が i-node 用。</text>
<rect x="40" y="84" width="132" height="78" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="106.0" y="110" font-size="12.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">データブロック</text>
<text x="106.0" y="128" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ビットマップ</text>
<text x="106.0" y="74" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">1 ブロック</text>
<rect x="172" y="84" width="132" height="78" rx="3" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="238.0" y="110" font-size="12.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node</text>
<text x="238.0" y="128" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ビットマップ</text>
<text x="238.0" y="74" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">1 ブロック</text>
<rect x="304" y="84" width="288" height="78" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="448.0" y="110" font-size="12.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node テーブル</text>
<text x="448.0" y="128" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">128 個</text>
<text x="448.0" y="74" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">4 ブロック</text>
<rect x="592" y="84" width="300" height="78" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="742.0" y="110" font-size="12.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">データブロック</text>
<text x="742.0" y="128" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ファイルの中身</text>
<text x="742.0" y="74" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">残り全部</text>
