<rect x="238.0" y="136" width="14" height="16" rx="1" fill="#c4b5fd" stroke="#7c5cc4" stroke-width="1"/>
<rect x="254.0" y="136" width="14" height="16" rx="1" fill="#ffffff" stroke="#c0b0e8" stroke-width="1"/>
<rect x="270.0" y="136" width="14" height="16" rx="1" fill="#ffffff" stroke="#c0b0e8" stroke-width="1"/>
<text x="287.0" y="148" font-size="12" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">⋯</text>
<rect x="307.0" y="132" width="66.0" height="20" rx="1" fill="#dcfce7" stroke="#3f8f52" stroke-width="1"/>
<text x="340.0" y="146" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">32 個</text>
<rect x="379.0" y="132" width="66.0" height="20" rx="1" fill="#dcfce7" stroke="#3f8f52" stroke-width="1"/>
<text x="412.0" y="146" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">32 個</text>
<rect x="451.0" y="132" width="66.0" height="20" rx="1" fill="#dcfce7" stroke="#3f8f52" stroke-width="1"/>
<text x="484.0" y="146" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">32 個</text>
<rect x="523.0" y="132" width="66.0" height="20" rx="1" fill="#dcfce7" stroke="#3f8f52" stroke-width="1"/>
<text x="556.0" y="146" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">32 個</text>
<path d="M 106.0 166 L 106.0 216 L 742.0 216 L 742.0 168" stroke="#b8690b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="356.0" y="212" font-size="11" fill="#b8690b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">1 ビット = 1 データブロック</text>
<path d="M 238.0 166 L 238.0 182 L 448.0 182 L 448.0 168" stroke="#7c5cc4" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="348.0" y="174" font-size="11" fill="#7c5cc4" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">1 ビット = 1 i-node</text>
<text x="450.0" y="242" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">同じ仕組みのビットマップを 2 枚使うだけで、ブロックの空きと i-node の空きの両方を管理できる。</text>
<text x="450.0" y="266" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node テーブルは 128 ÷ 32 = 4 ブロック。1 ブロックあたり 32 個が隙間なく並ぶ。</text>
<text x="450.0" y="290" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">どのブロックをどこに置くかは第 5 章で決める。</text>
</svg>
