<svg xmlns="http://www.w3.org/2000/svg" width="900" height="514" viewBox="0 0 900 514" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>write() が変えるのはメモリ上のコピー。ディスクは write_inode で追いつく</title>
<rect x="0" y="0" width="900" height="514" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">write("/a.txt", 0, 5000 バイト) の 3 段階</text>
<text x="450.0" y="46" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">メモリに置くのは Inode とビットマップだけ。ディスクに届く時点が、段ごとに違う</text>
<text x="282.5" y="78" font-size="13" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">①</text>
<text x="282.5" y="96" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">read_inode(ino)</text>
<text x="527.5" y="78" font-size="13" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">②</text>
<text x="527.5" y="96" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">inode_mod.write(...)</text>
<text x="772.5" y="78" font-size="13" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">③</text>
<text x="772.5" y="96" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">write_inode(ino, inode)</text>
<text x="158" y="138" font-size="11" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">メモリ</text>
<text x="158" y="155" font-size="9.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">Inode のコピー</text>
<rect x="170" y="112" width="225" height="86" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="282.5" y="138" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size = 0</text>
<text x="282.5" y="158" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[] = 0, 0, ...</text>
<text x="282.5" y="184" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">read_inode が作ったコピー</text>
<rect x="415" y="112" width="225" height="86" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="527.5" y="138" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size = 5000</text>
<text x="527.5" y="158" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[0] = 8, direct[1] = 9</text>
<text x="527.5" y="184" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">書き換わるのはコピーだけ</text>
<rect x="660" y="112" width="225" height="86" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="772.5" y="138" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size = 5000</text>
<text x="772.5" y="158" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[0] = 8, direct[1] = 9</text>
<text x="772.5" y="184" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">encode() して書き出す</text>
<text x="158" y="242" font-size="11" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">メモリ</text>
<text x="158" y="259" font-size="9.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ビットマップ 2 ブロック</text>
<rect x="170" y="216" width="225" height="86" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="282.5" y="242" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">変化なし</text>
<text x="282.5" y="288" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">マウント時に読み込んだまま</text>
<rect x="415" y="216" width="225" height="86" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="527.5" y="242" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bit 8, 9 = 1</text>
<text x="527.5" y="288" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">変えた直後に 4096 バイトまるごと書き戻す</text>
<rect x="660" y="216" width="225" height="86" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="772.5" y="242" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">変化なし</text>
<text x="772.5" y="288" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">この段では触らない</text>
<text x="158" y="346" font-size="11" fill="#24292f" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">ディスク</text>
<text x="158" y="363" font-size="9.5" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">イメージの中身</text>
<rect x="170" y="320" width="225" height="86" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="282.5" y="346" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">変化なし</text>
<text x="282.5" y="392" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">読むだけ</text>
<rect x="415" y="320" width="225" height="86" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="527.5" y="346" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">block 8, 9 にデータが入る</text>
<text x="527.5" y="366" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ビットマップのブロックも書き戻る</text>
<text x="527.5" y="392" font-size="10" fill="#b4413c" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">i-node テーブルはまだ size = 0</text>
<rect x="660" y="320" width="225" height="86" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="772.5" y="346" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node テーブル (block 3) が</text>
<text x="772.5" y="366" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size = 5000 に変わる</text>
<text x="772.5" y="392" font-size="9" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">これでディスクが追いつく</text>
<path d="M 397 155.0 L 411 155.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 642 155.0 L 656 155.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 397 259.0 L 411 259.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 642 259.0 L 656 259.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 397 363.0 L 411 363.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 642 363.0 L 656 363.0" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 405.0 62 L 405.0 141.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 405.0 169.0 L 405.0 245.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 405.0 273.0 L 405.0 349.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 405.0 377.0 L 405.0 416" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 650.0 62 L 650.0 141.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 650.0 169.0 L 650.0 245.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 650.0 273.0 L 650.0 349.0" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="M 650.0 377.0 L 650.0 416" stroke="#c9ced4" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<rect x="40" y="432" width="820" height="62" rx="4" fill="#fff7ed" stroke="#b8690b" stroke-width="1.5"/>
<text x="60" y="458" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">② の途中で ENOSPC になっても、block 8 はもう割り当て済み。i-node を書かずに例外を投げると、誰も指していない使用中ブロックが残る。</text>
<text x="60" y="480" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">だから失敗したときも write_inode を呼んでから raise する。③ を忘れると、マウントし直したときに size = 0 のファイルが出てくる。</text>
</svg>
