<path d="M 538 186 L 538 213 L 552 213" stroke="#8b949e" stroke-width="1.2" fill="none"/>
<text x="500" y="252" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">それ自身のルート（ino 1）を持つ</text>
<path d="M 40 290 L 860 290" stroke="#e1e4e8" stroke-width="1.2" fill="none"/>
<text x="60" y="320" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">マウント後：1 本に見える</text>
