<rect x="526" y="152" width="234" height="34" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="538" y="167" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">docs</text>
<text x="538" y="181" font-size="8.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino 3</text>
