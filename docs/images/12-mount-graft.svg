<text x="72" y="358" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">/</text>
<rect x="86" y="376" width="274" height="34" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="98" y="398" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">mnt</text>
<rect x="112" y="416" width="248" height="34" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="124" y="431" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">tiny-fs</text>
<text x="124" y="445" font-size="8.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ここが tiny-fs のルート（ino 1）</text>
<rect x="138" y="456" width="222" height="34" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="150" y="471" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">docs</text>
<text x="150" y="485" font-size="8.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino 3</text>
<path d="M 72 370 L 72 393 L 86 393" stroke="#8b949e" stroke-width="1.2" fill="none"/>
<path d="M 98 410 L 98 433 L 112 433" stroke="#8b949e" stroke-width="1.2" fill="none"/>
<path d="M 124 450 L 124 473 L 138 473" stroke="#8b949e" stroke-width="1.2" fill="none"/>
<path d="M 100 413 L 420 413" stroke="#b8860b" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<text x="430" y="409" font-size="10.5" fill="#b8860b" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">この 1 本が境目。上は ext4、ここから下は tiny-fs</text>
<text x="430" y="442" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">元の中身（old.txt）は隠れるだけで、消えない。</text>
<text x="430" y="462" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">アンマウントすれば戻る。</text>
<text x="450" y="522" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">どのディレクトリに何が貼られているかは、カーネルが表で持っている（/proc/mounts）。</text>
