<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>1 つのバッファが 2 本の鎖につながる</title>
<rect x="0" y="0" width="900" height="432" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<text x="450.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">1 つのバッファが 2 本の鎖につながる</text>
<text x="450.0" y="46" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">探すのはハッシュ表、空きを取るのは空きリスト、追い出す相手を選ぶのは LRU リスト</text>
<text x="40" y="80" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">ハッシュ表</text>
<text x="40" y="96" font-size="9" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">キーはブロック番号</text>
<rect x="40" y="120" width="92" height="28" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="54" y="139" font-size="9.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bucket 0</text>
<rect x="40" y="156" width="92" height="28" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="54" y="175" font-size="9.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bucket 1</text>
<rect x="40" y="192" width="92" height="28" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="54" y="211" font-size="9.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bucket 2</text>
<rect x="40" y="228" width="92" height="28" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="54" y="247" font-size="9.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">bucket 3</text>
<text x="230" y="92" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">バッファ（4096 バイトの入れ物）</text>
<rect x="230" y="110" width="230" height="56" rx="3" fill="#fde8c8" stroke="#b8860b" stroke-width="1.5"/>
<text x="244" y="133" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 7</text>
<text x="244" y="151" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ダーティ</text>
<rect x="230" y="176" width="230" height="56" rx="3" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="244" y="199" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 3</text>
<text x="244" y="217" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">クリーン</text>
<rect x="230" y="242" width="230" height="56" rx="3" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="244" y="265" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 11</text>
<text x="244" y="283" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">クリーン</text>
<rect x="230" y="308" width="230" height="56" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="244" y="331" font-size="11" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">（空き）</text>
<text x="244" y="349" font-size="9.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ブロック未割り当て</text>
<path d="M 134 134 L 226 128" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 134 170 L 226 194" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 134 206 L 226 260" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 134 242 L 226 326" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="560" y="92" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">LRU リスト（双方向）</text>
<text x="560" y="108" font-size="9" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">先頭が最近使ったもの、末尾が最も古いもの</text>
<rect x="560" y="128" width="300" height="28" rx="3" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="574" y="147" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block 3</text>
<text x="846" y="147" font-size="9" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">先頭</text>
<rect x="560" y="162" width="300" height="28" rx="3" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="574" y="181" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block 7</text>
<rect x="560" y="196" width="300" height="28" rx="3" fill="#fde8c8" stroke="#b8860b" stroke-width="1.5"/>
<text x="574" y="215" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block 11</text>
<text x="846" y="215" font-size="9" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">末尾 ← 追い出す候補</text>
<path d="M 710 156 L 710 160" stroke="#5b6fc4" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<path d="M 710 190 L 710 194" stroke="#5b6fc4" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<text x="560" y="250" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">空きリスト</text>
<text x="560" y="266" font-size="9" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ブロックを載せていないバッファだけが並ぶ</text>
<rect x="560" y="276" width="300" height="28" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="574" y="295" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">（空き）</text>
<text x="846" y="295" font-size="9" fill="#57606a" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">先頭を 1 個外すだけ</text>
<rect x="560" y="308" width="300" height="28" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="574" y="327" font-size="9" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">空のときは LRU の末尾から追い出して補充する</text>
<path d="M 464 138 L 554 138" stroke="#5b6fc4" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
<path d="M 464 336 L 554 290" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
<rect x="40" y="360" width="820" height="56" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="58" y="382" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">どの操作も鎖の先頭か末尾を見るだけで済む。バッファ全体を走査しない。</text>
<text x="58" y="402" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ハッシュ表でヒット判定、空きリストで場所の確保、LRU リストで解放対象の選択 — 役割が分かれている。</text>
</svg>
