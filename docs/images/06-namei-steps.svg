<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>/docs/a.txt を 1 成分ずつたどる</title>
<rect x="0" y="0" width="900" height="452" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<text x="450.0" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">/docs/a.txt を、ルートから 1 成分ずつたどる</text>
<text x="30" y="94" font-size="12.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">① 現在地 /</text>
<text x="30" y="114" font-size="11" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<text x="30" y="132" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">残り: docs/a.txt</text>
<text x="250" y="64" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">この i-node の中身（dirent を先頭から線形検索）</text>
<rect x="250" y="74" width="132" height="42" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="316.0" y="93" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"."</text>
<text x="316.0" y="108" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 1</text>
<rect x="390" y="74" width="132" height="42" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="456.0" y="93" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".."</text>
<text x="456.0" y="108" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 1</text>
<rect x="530" y="74" width="132" height="42" rx="2" fill="#fde68a" stroke="#b8860b" stroke-width="2.2"/>
<text x="596.0" y="93" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"docs"</text>
<text x="596.0" y="108" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 3</text>
<rect x="670" y="74" width="132" height="42" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="736.0" y="93" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"memo.txt"</text>
<text x="736.0" y="108" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 5</text>
<path d="M 596.0 120 l 0 14" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="596.0" y="148" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">"docs" が一致 → ino = 3</text>
<text x="30" y="226" font-size="12.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">② 現在地 /docs</text>
<text x="30" y="246" font-size="11" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 3</text>
<text x="30" y="264" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">残り: a.txt</text>
<text x="250" y="196" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">この i-node の中身（dirent を先頭から線形検索）</text>
<rect x="250" y="206" width="132" height="42" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="316.0" y="225" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"."</text>
<text x="316.0" y="240" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 3</text>
<rect x="390" y="206" width="132" height="42" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="456.0" y="225" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".."</text>
<text x="456.0" y="240" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 1</text>
<rect x="530" y="206" width="132" height="42" rx="2" fill="#fde68a" stroke="#b8860b" stroke-width="2.2"/>
<text x="596.0" y="225" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"a.txt"</text>
<text x="596.0" y="240" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">→ ino 5</text>
<path d="M 596.0 252 l 0 14" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="596.0" y="280" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">"a.txt" が一致 → ino = 5</text>
<text x="30" y="360" font-size="12.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">③ 残りの成分なし</text>
<rect x="250" y="338" width="300" height="44" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="400" y="365" font-size="13" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">/docs/a.txt = ino 5</text>
<text x="570" y="365" font-size="10.5" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">この ino の i-node を読めば、中身も属性も取れる</text>
<text x="450.0" y="418" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">やることは「今のディレクトリで名前を引き、得た ino に移る」の繰り返しだけ。</text>
<text x="450.0" y="440" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">「.」「..」も dirent として実在するので、特別扱いは要らない。</text>
</svg>
