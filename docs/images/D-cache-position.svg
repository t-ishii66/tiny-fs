<path d="M 670 114 L 670 130" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="680" y="128" font-size="9.5" fill="#3f8f52" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">read_block / write_block</text>
<rect x="500" y="132" width="340" height="38" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="514" y="156" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">CachedBlockDevice</text>
<text x="700" y="156" font-size="10" fill="#3f8f52" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">← 1 枚挟む</text>
<path d="M 670 170 L 670 186" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="680" y="184" font-size="9.5" fill="#3f8f52" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">read_block / write_block</text>
<rect x="500" y="188" width="340" height="38" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="514" y="212" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">L1  disk.py (BlockDevice)</text>
<path d="M 670 226 L 670 242" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="500" y="244" width="340" height="38" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="514" y="268" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">L0  device.py</text>
<path d="M 670 282 L 670 298" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="500" y="300" width="340" height="30" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="670" y="320" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">disk.img</text>
<text x="450" y="330" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">上下のインタフェースが同じ read_block / write_block なので、L2 以上のコードは 1 行も変わらない。</text>
