<text x="30" y="42" font-size="11" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">offset（ブロック先頭からのバイト位置）</text>
<text x="450.0" y="158" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">各フィールドは符号なし 32 ビット整数（リトルエンディアン）。残り 4064 バイトはゼロ。</text>
<text x="450.0" y="188" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">先頭 4 バイトは 31 73 66 74 — 整数 0x74667331 を下位バイトから書くので、ダンプでは "1sft" と並ぶ</text>
</svg>
