<text x="450.0" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">superblock — "&lt;IIIIIIII" / 32 バイト（ブロック 0 の先頭）</text>
