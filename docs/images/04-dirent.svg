<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>dirent の 32 バイト</title>
<rect x="0" y="0" width="900" height="250" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<text x="450.0" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">dirent — "&lt;I27sx" / 32 バイト（4096 ÷ 32 = 128 エントリ / ブロック）</text>
<rect x="40.0" y="78" width="102.5" height="46" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="91.25" y="106" font-size="12" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino</text>
<rect x="142.5" y="78" width="691.875" height="46" rx="3" fill="#ffedd5" stroke="#b8690b" stroke-width="1.5"/>
<text x="488.4375" y="106" font-size="12" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">name — NUL 埋め、終端なし</text>
<rect x="834.375" y="78" width="25.625" height="46" rx="3" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
<text x="52.8125" y="70" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">0</text>
<text x="155.3125" y="70" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">4</text>
<text x="257.8125" y="70" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">8</text>
<text x="360.3125" y="70" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">12</text>
<text x="462.8125" y="70" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">16</text>
<text x="565.3125" y="70" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">20</text>
<text x="667.8125" y="70" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">24</text>
<text x="770.3125" y="70" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">28</text>
<text x="847.1875" y="70" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">31</text>
<text x="847.1875" y="158" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">pad</text>
<path d="M 847.1875 128 L 847.1875 146" stroke="#57606a" stroke-width="1"/>
<text x="450.0" y="184" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ino = 0 は「空きスロット」。削除はエントリを詰めず 0 を書くだけで、size も縮めない</text>
<text x="450.0" y="208" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">→ エントリの位置が動かないので、readdir がオフセットを持って何度呼ばれても安全</text>
<text x="450.0" y="236" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">MAX_NAME_LEN = 27 = 32 − 4 (ino) − 1 (NUL)</text>
</svg>
