<svg xmlns="http://www.w3.org/2000/svg" width="900" height="292" viewBox="0 0 900 292" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>例外に、呼び出し元が指定したパスを付け直す</title>
<rect x="0" y="0" width="900" height="292" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">例外に、呼び出し元が指定したパスを付け直す</text>
<text x="450" y="48" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">lookup("/docs/a.txt") を呼び、/docs は見つかったが、その中に a.txt が無かった場合</text>
<rect x="40" y="86" width="240" height="96" rx="3" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.5"/>
<text x="160" y="110" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">directory 層</text>
<text x="160" y="136" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">NotFoundError(b"a.txt")</text>
<text x="160" y="152" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">知っているのは成分 1 個だけ</text>
<rect x="330" y="76" width="240" height="96" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="450" y="100" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">_lookup_in（fs.py）</text>
<text x="450" y="126" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">呼び出し元が渡したパスを</text>
<text x="450" y="148" font-size="10.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">持っているのはこの層だけ</text>
<rect x="620" y="76" width="240" height="96" rx="3" fill="#fff7ed" stroke="#b8690b" stroke-width="1.5"/>
<text x="740" y="100" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">呼び出し元に届く例外</text>
<text x="740" y="128" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">NotFoundError(</text>
<text x="740" y="148" font-size="10" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">    "/docs/a.txt")</text>
<path d="M 286 124 L 324 124" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="305" y="114" font-size="9" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">except</text>
<path d="M 576 124 L 614 124" stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="595" y="114" font-size="9" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">raise</text>
<text xml:space="preserve" x="150" y="216" font-size="11.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">x  ENOENT: a.txt        &lt;- どの a.txt か分からない</text>
<text xml:space="preserve" x="150" y="244" font-size="11.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">o  ENOENT: /docs/a.txt  &lt;- 指定したとおりの名前で返る</text>
<text x="450" y="280" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">中身は同じ例外。付け替えるのは名前だけ。</text>
</svg>
