<text x="436" y="86" font-size="11" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">_flush()</text>
<text x="436" y="112" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">write_block(1, buf)</text>
<text x="40" y="162" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">allocate() が返した block 8。ビットを立てた同じ呼び出しの中で、ブロック 1 を丸ごと書き戻す。</text>
<text x="40" y="182" font-size="11" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">mark_used() と mark_free() も同じ。ビットが 1 個変われば 4096 バイト書く。</text>
<path d="M 40 206 L 860 206" stroke="#e1e4e8" stroke-width="1.2" fill="none"/>
<text x="40" y="234" font-size="11.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">free_hint だけは close() まで持つ</text>
