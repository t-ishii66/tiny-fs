<text x="165" y="272" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">self.hint</text>
<text x="165" y="292" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">割り当てのたびに +1（メモリ上）</text>
<path d="M 300 277 L 464 277" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="384" y="268" font-size="10.5" fill="#b8860b" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">close() で 1 回だけ</text>
<rect x="478" y="248" width="330" height="58" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="643" y="272" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">block 0（スーパーブロック）の free_hint</text>
<text x="643" y="292" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">次に空きを探し始める位置</text>
<text x="450" y="336" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">この値は古くても正しさに影響しない。だから割り当てのたびにブロック 0 を書き直さない。</text>
