<text x="40" y="38" font-size="11" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">セクタ番号 = 番地</text>
<rect x="40" y="162" width="400" height="56" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="240" y="186" font-size="13" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">read_sector(n) → 512 バイト</text>
<text x="240" y="205" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">n 番地の中身をそのまま返す</text>
<rect x="470" y="162" width="400" height="56" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="670" y="186" font-size="13" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">write_sector(n, data)</text>
<text x="670" y="205" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">n 番地に 512 バイトデータを上書きする</text>
<text x="450.0" y="250" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">装置ができるのはこの 2 つだけ。名前・可変長・追記・空きの管理はどこにもない。</text>
<text x="450.0" y="272" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">読み書きはつねに 512 バイト単位。「512 バイト未満だけ書く」も「途中に挿入する」もできない。</text>
</svg>
