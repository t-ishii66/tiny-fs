<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" viewBox="0 0 900 312" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>read は size までしか返さない</title>
<rect x="0" y="0" width="900" height="312" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">read は size までしか返さない</text>
<rect x="40" y="92" width="380" height="50" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<rect x="420" y="92" width="380" height="50" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="230" y="112" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block 8</text>
<text x="462" y="112" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block 9</text>
<rect x="504" y="92" width="296" height="50" fill="#ffffff" fill-opacity="0.68"/>
<text x="652" y="134" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">size の外（確保済みだが読まない）</text>
<path d="M 504 84 L 504 150" stroke="#b8860b" stroke-width="1.8" fill="none"/>
<text x="504" y="78" font-size="10.5" fill="#b8860b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size = 5000</text>
<text x="40" y="164" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">0</text>
<text x="420" y="164" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">4096</text>
<text x="800" y="164" font-size="9" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">8192</text>
<path d="M 411 186 L 800 186" stroke="#57606a" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
<path d="M 411 180 L 411 192" stroke="#57606a" stroke-width="1.4" fill="none"/>
<path d="M 800 180 L 800 192" stroke="#57606a" stroke-width="1.4" fill="none"/>
<text x="605" y="206" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">頼まれた範囲 read(offset=4000, length=4096)</text>
<path d="M 411 232 L 504 232" stroke="#b8860b" stroke-width="4" fill="none"/>
<text x="520" y="236" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">実際に返るのは 1000 バイト（size - offset）</text>
<text x="450" y="280" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">offset が size 以上なら、空のバイト列が返る。</text>
<text x="450" y="302" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ディレクトリを read したら EISDIR。中身を列挙するのは readdir（第 8 章）。</text>
</svg>
