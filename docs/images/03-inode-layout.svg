<text x="430.0" y="372" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">direct[i] == 0 は「未割り当て」。ブロック 0 はスーパーブロックなので番兵に使える</text>
<text x="430.0" y="392" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino → ブロック = inode_table_start + (ino-1) // 32,  オフセット = ((ino-1) % 32) * 128</text>
