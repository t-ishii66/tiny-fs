<svg xmlns="http://www.w3.org/2000/svg" width="900" height="428" viewBox="0 0 900 428" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>間接ブロックを 1 本足すと何が変わるか</title>
<rect x="0" y="0" width="900" height="428" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<text x="450.0" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">間接ブロックを 1 本足すと、上限が 48 KiB から約 4 MiB になる</text>
<text x="130.0" y="64" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">i-node</text>
<rect x="40" y="74" width="180" height="22" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.4"/>
<text x="50" y="90" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[0]</text>
<rect x="40" y="98" width="180" height="22" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.4"/>
<text x="50" y="114" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[1]</text>
<rect x="40" y="122" width="180" height="22" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.4"/>
<text x="50" y="138" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[2]</text>
<rect x="40" y="146" width="180" height="22" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.4"/>
<text x="50" y="162" font-size="10" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[3]</text>
<text x="130.0" y="184" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">⋮  （12 本）</text>
<rect x="40" y="200" width="180" height="26" rx="2" fill="#fde68a" stroke="#b8860b" stroke-width="2"/>
<text x="50" y="218" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">indirect</text>
<text x="210" y="218" font-size="9.5" fill="#b8860b" text-anchor="end" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">← 足す 1 本</text>
<path d="M 224 213 L 324 190" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="330" y="150" width="220" height="90" rx="3" fill="#eef2ff" stroke="#5b6fc4" stroke-width="1.4"/>
<text x="440.0" y="140" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">間接ブロック（4096 バイト）</text>
<text x="440.0" y="178" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ブロック番号が</text>
<text x="440.0" y="200" font-size="15" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="bold">1024 個</text>
<text x="440.0" y="222" font-size="10" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">4096 ÷ 4</text>
<path d="M 554 195 L 614 195" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="620" y="140" width="180" height="24" rx="2" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.4"/>
<text x="710" y="157" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">データブロック</text>
<rect x="620" y="170" width="180" height="24" rx="2" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.4"/>
<text x="710" y="187" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">データブロック</text>
<rect x="620" y="200" width="180" height="24" rx="2" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.4"/>
<text x="710" y="217" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">データブロック</text>
<rect x="620" y="230" width="180" height="24" rx="2" fill="#f3f4f6" stroke="#8b949e" stroke-width="1.4"/>
<text x="710" y="247" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">データブロック</text>
<text x="710" y="268" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">⋮  1024 個</text>
<text x="40" y="300" font-size="12" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">持たせるポインタと、届くファイルサイズ</text>
<text x="40" y="322" font-size="10.5" fill="#3f8f52" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">直接 12 本のみ（tiny-fs）</text>
<text x="300" y="322" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">12 ブロック</text>
<text x="480" y="322" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">48 KiB</text>
<text x="40" y="341" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">＋ 単間接 1 本</text>
<text x="300" y="341" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">＋ 1024 ブロック</text>
<text x="480" y="341" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">約 4 MiB</text>
<text x="40" y="360" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">＋ 二重間接 1 本</text>
<text x="300" y="360" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">＋ 1024² ブロック</text>
<text x="480" y="360" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">約 4 GiB</text>
<text x="40" y="379" font-size="10.5" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">＋ 三重間接 1 本</text>
<text x="300" y="379" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">＋ 1024³ ブロック</text>
<text x="480" y="379" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">約 4 TiB</text>
<text x="450.0" y="418" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">仕組みは同じ間接参照の繰り返しで、増えるのは階層の数だけ。</text>
</svg>
