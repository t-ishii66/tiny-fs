<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>ディレクトリは普通のファイル</title>
<rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6fc4"/></marker></defs>
<text x="450.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">ディレクトリ = 中身が dirent の配列になっているだけの普通のファイル</text>
<rect x="40" y="76" width="190" height="120" rx="3" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="135" y="68" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">i-node (ino = 1)</text>
<text x="52" y="100" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">mode</text>
<text x="218" y="100" font-size="10.5" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">0o040755</text>
<text x="52" y="120" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">nlink</text>
<text x="218" y="120" font-size="10.5" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">3</text>
<text x="52" y="140" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">size</text>
<text x="218" y="140" font-size="10.5" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">128</text>
<text x="52" y="160" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[0]</text>
<text x="218" y="160" font-size="10.5" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">7</text>
<text x="52" y="180" font-size="10.5" fill="#57606a" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">direct[1..]</text>
<text x="218" y="180" font-size="10.5" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">0</text>
<text x="135" y="214" font-size="10" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">種別ビットだけが普通のファイルと違う</text>
<path d="M 232 136 L 286 136" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="400.0" y="68" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">block 7 （4096 バイト）</text>
<rect x="250" y="76" width="300" height="30" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="260" y="96" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<text x="540" y="96" font-size="11" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"."</text>
<text x="558" y="96" font-size="9" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">32 B</text>
<rect x="250" y="106" width="300" height="30" rx="2" fill="#e0e7ff" stroke="#5b6fc4" stroke-width="1.5"/>
<text x="260" y="126" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 1</text>
<text x="540" y="126" font-size="11" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">".."</text>
<text x="558" y="126" font-size="9" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">32 B</text>
<rect x="250" y="136" width="300" height="30" rx="2" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="260" y="156" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 3</text>
<text x="540" y="156" font-size="11" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"docs"</text>
<text x="558" y="156" font-size="9" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">32 B</text>
<rect x="250" y="166" width="300" height="30" rx="2" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="260" y="186" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 5</text>
<text x="540" y="186" font-size="11" fill="#24292f" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"memo.txt"</text>
<text x="558" y="186" font-size="9" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">32 B</text>
<rect x="250" y="196" width="300" height="30" rx="2" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="400.0" y="216" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">size = 128 なので、ここから先は存在しない</text>
<text x="750" y="68" font-size="11" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">i-node テーブル</text>
<rect x="640" y="102" width="220" height="46" rx="3" fill="#ede9fe" stroke="#7c5cc4" stroke-width="1.5"/>
<text x="652" y="122" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 3</text>
<text x="652" y="139" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">ディレクトリ docs の実体</text>
<rect x="640" y="166" width="220" height="46" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="652" y="186" font-size="10.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">ino = 5</text>
<text x="652" y="203" font-size="10" fill="#57606a" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">memo.txt の実体</text>
<path d="M 590 151 L 634 125" stroke="#5b6fc4" stroke-width="1.5" fill="none" marker-end="url(#g)"/>
<path d="M 590 181 L 634 189" stroke="#5b6fc4" stroke-width="1.5" fill="none" marker-end="url(#g)"/>
<text x="450.0" y="296" font-size="12" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">名前が入っているのは dirent だけ。i-node は自分が何と呼ばれているか知らない。</text>
<text x="450.0" y="318" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">だから同じ i-node に複数の名前を付けられる（ハードリンク）。tiny-fs では nlink だけ持ち、link() は実装しない。</text>
</svg>
