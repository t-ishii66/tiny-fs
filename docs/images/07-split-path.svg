<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif">
<title>split_path は空の成分を除外する</title>
<rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/></marker></defs>
<text x="450" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">split_path("//docs///a.txt") — 空の成分を除外するだけ</text>
<text x="40" y="78" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="bold">入力</text>
<text x="100" y="78" font-size="12.5" fill="#24292f" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"//docs///a.txt"</text>
<path d="M 120 90 l 0 24" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="140" y="110" font-size="10.5" fill="#b8860b" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">path.split("/")</text>
<rect x="40" y="126" width="120" height="40" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="100" y="152" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">""</text>
<rect x="168" y="126" width="120" height="40" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="228" y="152" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">""</text>
<rect x="296" y="126" width="120" height="40" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="356" y="152" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"docs"</text>
<rect x="424" y="126" width="120" height="40" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="484" y="152" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">""</text>
<rect x="552" y="126" width="120" height="40" rx="3" fill="#f6f8fa" stroke="#c9ced4" stroke-width="1.5"/>
<text x="612" y="152" font-size="11" fill="#57606a" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">""</text>
<rect x="680" y="126" width="120" height="40" rx="3" fill="#dbeafe" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="740" y="152" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">"a.txt"</text>
<path d="M 120 174 l 0 24" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="140" y="194" font-size="10.5" fill="#b8860b" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">if c   # 空の成分を除外する</text>
<rect x="40" y="210" width="120" height="40" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="100" y="236" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">b"docs"</text>
<rect x="168" y="210" width="120" height="40" rx="3" fill="#dcfce7" stroke="#3f8f52" stroke-width="1.5"/>
<text x="228" y="236" font-size="11" fill="#24292f" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">b"a.txt"</text>
<text x="320" y="236" font-size="11" fill="#24292f" text-anchor="start" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">"/docs/a.txt" も "//docs///a.txt/" も、これで同じ 2 成分になる</text>
<text x="450" y="290" font-size="11.5" fill="#24292f" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">この関数の処理は分割と正規化だけ。ディスクは 1 バイトも読まない。</text>
<text x="450" y="314" font-size="11" fill="#57606a" text-anchor="middle" font-family="Helvetica Neue, Arial, Hiragino Sans, Noto Sans JP, sans-serif" font-weight="normal">先頭が / でなければ EINVAL。tiny-fs は相対パスを受け取らない。</text>
</svg>
